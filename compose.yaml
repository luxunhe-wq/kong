name: monilite

services:
  monilite:
    image: ${MONILITE_IMAGE:-${KONG_IMAGE:-monilite:local}}
    build:
      context: .
    restart: unless-stopped
    init: true
    # Linux host namespaces are required for host network rates, ports and process attribution.
    network_mode: host
    pid: host
    uts: host
    read_only: true
    security_opt:
      - no-new-privileges:true
      # Docker's AppArmor profile blocks reading host processes outside its own profile.
      - apparmor:unconfined
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - SYS_PTRACE
    environment:
      MONILITE_HOST: ${MONILITE_HOST:-${KONG_HOST:-0.0.0.0}}
      MONILITE_PORT: ${MONILITE_PORT:-${KONG_PORT:-8080}}
      MONILITE_HOST_ROOT: /host
      MONILITE_DATA_DIR: /var/lib/monilite
      MONILITE_SECURE_COOKIE: ${MONILITE_SECURE_COOKIE:-${KONG_SECURE_COOKIE:-0}}
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - monilite-data:/var/lib/monilite
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  monilite-data:
    # Set this to the old volume name when upgrading an existing deployment.
    name: ${MONILITE_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-monilite}_monilite-data}
    external: ${MONILITE_DATA_VOLUME_EXTERNAL:-false}
