name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Verify Docker deployment
        shell: bash
        run: |
          set -o pipefail
          python tests/docker_smoke.py 2>&1 | tee /tmp/kong-docker-smoke.log
      - name: Report Docker failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/kong-docker-smoke.log')
          if path.exists():
              tail = '\n'.join(path.read_text().splitlines()[-80:])
              escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Docker deployment check::' + escaped)
          PY
